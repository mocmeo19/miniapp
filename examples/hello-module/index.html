<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { margin: 0; padding: 48px; font-family: system-ui, sans-serif; color: #24213c; background: #faf9ff; }
      main { max-width: 520px; padding: 30px; border: 1px solid #eae5f7; border-radius: 16px; background: #fff; }
      h1 { margin-top: 0; } input, button { height: 40px; border-radius: 8px; font: inherit; }
      input { padding: 0 12px; border: 1px solid #ddd7ec; } button { padding: 0 18px; border: 0; background: #6c48ed; color: #fff; cursor: pointer; }
      p { color: #766f8b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello Module</h1>
      <p>This page calls its main process action through the Miniapp bridge.</p>
      <input id="name" placeholder="Your name" />
      <button id="greet">Say hello</button>
      <p id="result"></p>
    </main>
    <script>
      document.getElementById('greet').addEventListener('click', async () => {
        try {
          const result = await window.miniapp.invoke('greet', document.getElementById('name').value)
          document.getElementById('result').textContent = `${result.text} Greeted ${result.count} time(s).`
        } catch (error) {
          document.getElementById('result').textContent = error.message
        }
      })
    </script>
  </body>
</html>
